{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f8fc;
      margin: 0;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .sidebar {
      width: 230px;
      background: linear-gradient(180deg, #3b3b98 0%, #4a69bd 100%);
      color: white;
      flex-shrink: 0;
      padding: 20px;
      position: fixed;
      top: 0; bottom: 0;
      transition: 0.3s;
      z-index: 100;
    }

    .sidebar h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .sidebar a {
      display: block;
      padding: 10px 12px;
      color: #e4e4e4;
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 8px;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background-color: rgba(255,255,255,0.15);
      color: #fff;
    }

    .sidebar hr {
      border-color: rgba(255,255,255,0.2);
      margin: 20px 0;
    }

    main {
      flex-grow: 1;
      margin-left: 230px;
      padding: 50px;
      transition: 0.3s;
    }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.show {
        transform: translateX(0);
      }
      main {
        margin-left: 0;
      }
      .toggle-btn {
        display: block;
      }
    }

    .toggle-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      font-size: 24px;
      color: #3b3b98;
      cursor: pointer;
      display: none;
      z-index: 101;
    }
  </style>
</head>

<body>
  <div class="toggle-btn" onclick="document.querySelector('.sidebar').classList.toggle('show')">☰</div>

  <div class="sidebar">
  <h2>Admin Panel</h2>

  <a href="{% url 'admin_dashboard' %}">📊 Dashboard</a>

  <hr>

  <a href="{% url 'admin-announcement-list' %}">📜 Announcements</a>
  <a href="{% url 'admin-event-list' %}">📅 Events</a>
  <a href="{% url 'admin-ministry-list' %}">🤝 Ministries</a>
  <a href="{% url 'admin-memberprofile-list' %}">👤 Members Profile</a>
  <a href="{% url 'admin-fundtracking-list' %}">💹 Fund Tracking</a>

  <hr>

  <a href="{% url 'logout' %}" style="color:#f1c40f;">🚪 Logout</a>
</div>

  <main>
    {% block content %}{% endblock %}
  </main>

</body>
</html>
